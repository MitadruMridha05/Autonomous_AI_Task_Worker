name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Import check
        run: python -c "import app.main, agent.cli, evals.run_evals, evals.report"
      - name: Unit and integration tests
        run: pytest -q
      - name: Deterministic evaluation suite
        run: python -m evals.run_evals --output runs/eval_results.json
      - name: Evaluation report
        run: python -m evals.report --results runs/eval_results.json --output-dir runs/report
